business:
  status: confirmed
  business_goal: Reduce revenue lost to customers who stop ordering.
  business_kpi: Retained revenue from contacted customers
  decision_supported: The retention team sends an offer to the customers most likely
    to lapse each week.
  users: Retention marketing team
  capacity: 500 offers a week
  current_approach: A rule flags customers with no order in the last 30 days.
  outcome: Customers who are about to stop ordering.
  output_use: ranked_list
  v1_bar_intent: Finds more of the customers who lapse than the 30 day rule, at the
    same 500 offers a week.
  ml_needed: 'yes'
  ml_needed_reason: The 30 day rule misses customers whose ordering slows down gradually,
    and offers have a real cost.
  constraints:
    latency: Not a concern, weekly batch scoring
    interpretability: Top reasons for each score should be available to the team
    fairness: No protected attributes as features
    data_access: Order and account tables only
    other: []
  out_of_scope:
  - Choosing which offer to send
  risks:
  - problem: The first goal given was "build a churn model", which is the model, not
      a business outcome.
    resolution: Restated as reducing revenue lost to lapsed customers, measured by
      retained revenue.
  - problem: Offers may stop customers from lapsing, which changes future labels.
    resolution: Open question for the evaluation stage, about keeping a holdout group.
