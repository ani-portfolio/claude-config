assumptions:
- The weekly offer capacity stays at about 500.
- The customer base in the test period is like the one the model will score next.
- The sample has about 380 customers per week, so k is 50 instead of the 500 used
  in production.
open_questions:
- id: Q1
  question: Can a random holdout group be kept out of the offers, so future labels
    are not biased?
  stage: evaluation
  raised_by: ml-business-framing
  status: open
- id: Q2
  question: 'What do these orders columns mean: `c14`? (see notebooks/02_data_discovery.ipynb)'
  stage: framing
  raised_by: ml-data-discovery
  status: resolved
  answer: Answered in the data dictionary.
- id: Q3
  question: 'When are these orders columns filled in, relative to the outcome: `refund_dt`?
    If after, they must be excluded from the features.'
  stage: framing
  raised_by: ml-data-discovery
  status: open
- id: Q4
  question: 'The join of customers and orders on customer_id is many to many: a join
    multiplies rows, so aggregate one side to the key first. Is that expected?'
  stage: framing
  raised_by: ml-data-discovery
  status: resolved
  answer: Expected. Orders are aggregated per customer before any join; the model
    table has one row per customer and week.
- id: Q5
  question: 1,836 rows share the same customer_id + scoring_date. Should they be aggregated,
    or is the unit of prediction finer than the framing says?
  stage: framing
  raised_by: ml-eda-report
  status: open
decisions:
- date: '2026-10-08'
  stage: business
  decision: V1 is measured against the 30 day rule at the same weekly volume.
  reason: It is the current approach, and the team understands it.
- date: '2026-10-08'
  stage: framing
  decision: The outcome window is 60 days.
  reason: It matches how the retention team defines a lapsed customer.
retired_assumptions:
- assumption: Scoring dates are Mondays and every active customer is scored each week.
  reason: 'Confirmed by the data: the scoring dates are weekly Mondays.'
  retired_on: '2026-10-09'
- assumption: orders_90d and spend_90d are computed from orders before the scoring
    date only.
  reason: Confirmed with the data owner.
  retired_on: '2026-10-09'
