config:
  numeric: []
  categorical:
  - store_id
  high_cardinality: []
  date_parts:
    date:
    - dayofweek
    - month
    - week
  days_since: []
  log: []
  ratios: []
  lags:
  - column: sales
    days:
    - 28
    - 35
    - 364
    by: store_id
  rolling:
  - column: sales
    windows:
    - 7
    - 28
    stats:
    - mean
    shift_days: 28
    by: store_id
  custom: true
  date_col: date
  target: sales
  min_shift_days: 28
  target_min_shift_days: 28
  rare_min_frequency: 0.01
  exclude: []
excluded:
  date: the prediction date itself; its calendar parts are used instead
feature_reasons:
  store_id: the series ID, so the model can learn each series' level
  date_dayofweek: calendar part of the prediction date `date`
  date_month: calendar part of the prediction date `date`
  date_week: calendar part of the prediction date `date`
  sales_lag_28d: sales 28 days earlier (at least the 28 day horizon)
  sales_lag_35d: sales 35 days earlier (at least the 28 day horizon)
  sales_lag_364d: sales 364 days earlier (at least the 28 day horizon)
  sales_roll_7d_mean_shift_28d: mean sales over 7 days, ending 28 days earlier
  sales_roll_28d_mean_shift_28d: mean sales over 28 days, ending 28 days earlier
leakage_threshold: 0.9
confirmed_safe: []
reasoning: {}
risks: []
assumptions: []
open_questions: []
decisions: []
resolved_questions: []

